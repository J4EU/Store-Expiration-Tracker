name: store-expiration-tracker-prod

services:
  nginx:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./frontend/nginx.ec2.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
        read_only: true
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - ./deploy/prod/backend.env
    expose:
      - "8000"
    volumes:
      - type: bind
        source: /srv/store-expiration-tracker/data
        target: /app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
